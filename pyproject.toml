[project]
name = "renewi-fire-smoke-poc"
version = "0.1.0"
description = "Renewi Fire & Smoke Detection proof of concept"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.7",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.37",
    "pydantic==2.10.6",
    "python-multipart>=0.0.20",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
    "ultralytics>=8.3.0",
]

[dependency-groups]
test = [
    "httpx>=0.27,<0.29",
    "pytest==8.3.4",
]

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
testpaths = ["tests"]
